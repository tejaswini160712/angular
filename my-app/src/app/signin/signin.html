<div class="signin-page">
  <div class="signin-card">
    <div class="signin-header">
      <span class="brand-pill">Welcome back</span>
      <h1>Sign In</h1>
    </div>

    <form class="signin-form" [formGroup]="signinForm" (ngSubmit)="onSubmit()">
      <div class="field-group">
        <label>Work email</label>
        <input type="email" formControlName="email" placeholder="you@example.com" />
        <small *ngIf="signinForm.get('email')?.touched && signinForm.get('email')?.invalid">
          Please enter a valid email.
        </small>
      </div>

      <div class="field-group">
        <label>Password</label>
        <input type="password" formControlName="password" placeholder="Enter your password" />
        <small *ngIf="signinForm.get('password')?.touched && signinForm.get('password')?.invalid">
          Password must be at least 8 characters.
        </small>
      </div>

      <button type="submit" [disabled]="isSubmitting" (click)="navigateTodashboard()">
        {{ isSubmitting ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p class="signin-message" *ngIf="msgdata">{{ msg }}</p>
  </div>
</div>
